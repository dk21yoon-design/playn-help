<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">

<meta property="og:title" content="오늘 뭐 하지? 파티 플래너"><meta property="og:description" content="인원·분위기만 고르면 게임 라인업과 지점·요금을 추천해 드려요."><meta property="og:image" content="https://playn.kr/assets/og.png"><meta property="og:url" content="https://playn.kr/plan/">

<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" rel="stylesheet">

<style>
.ph{padding:30px 0 4px}.ph h1{font-size:clamp(36px,8vw,64px)}.ph p{color:var(--mute);font-size:17px;margin-top:10px}
.q{margin-top:26px}.q h2{font-size:15px;color:var(--lamp);font-weight:800;font-family:Pretendard,sans-serif;letter-spacing:0}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.opts button{border:1.5px solid var(--line);background:var(--panel);color:var(--ink);font:600 15px Pretendard,sans-serif;padding:11px 15px;border-radius:12px;cursor:pointer}
.opts button[aria-pressed=true]{background:var(--lamp);border-color:var(--lamp);color:var(--night)}
.num{display:flex;align-items:center;gap:10px;margin-top:10px}
.num button{width:46px;height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);font:800 22px Pretendard,sans-serif;cursor:pointer}
.num output{font:400 40px "Black Han Sans",sans-serif;min-width:90px;text-align:center}
.res{margin-top:32px;background:var(--deep);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px}
.res h2{font-size:clamp(24px,5vw,32px)}
.res .lead{color:var(--mute);margin-top:6px}
.games{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:16px}
@media(max-width:600px){.games{grid-template-columns:1fr}}
.gm{background:var(--panel);border-radius:14px;padding:14px}
.gm b{font-size:17px}.gm .m{color:var(--dim);font-size:13px;margin-top:2px}.gm p{font-size:14.5px;margin-top:6px;color:var(--mute)}
.gm a{font-size:13.5px;color:var(--lamp);font-weight:700;display:inline-block;margin-top:6px}
.tip{margin-top:14px;padding:14px;border-radius:12px;background:#2B1D5E;color:#E3DCFF;font-size:14.5px}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
@media(max-width:600px){.pick{grid-template-columns:1fr}}
.pick .card{background:var(--panel);border-radius:14px;padding:16px}
.pick .card .k{font-size:13px;color:var(--dim);font-weight:700}
.pick .card b{display:block;font-size:20px;margin-top:2px}
.pick .card .p{color:var(--lamp);font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:4px}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
</style>
</head><body>
<header class="top"><div class="wrap"><a class="logo" href="/">PLAY <b>N</b></a>
<nav><a href="/#deals">공실특가</a><a href="/gear/">기어</a><a href="/plan/">파티 플래너</a><a href="/#crew" class="join">N CREW 가입</a></nav></div></header>
<main class="wrap">
  <div class="crumb"><a href="/">플레이앤</a> / 파티 플래너</div>
  <section class="ph"><h1 class="disp">오늘 뭐 하지?</h1><p>세 가지만 고르면 같이 할 게임, 맞는 지점, 예상 요금까지 정리해 드려요.</p></section>

  <div class="q"><h2>1. 몇 명이 모여요?</h2><div class="num"><button type="button" id="minus" aria-label="한 명 줄이기">−</button><output id="ppl">4명</output><button type="button" id="plus" aria-label="한 명 늘리기">+</button></div></div>
  <div class="q"><h2>2. 오늘 분위기는?</h2><div class="opts" id="vibe"></div></div>
  <div class="q"><h2>3. 언제 놀아요?</h2><div class="opts" id="when"></div></div>

  <section class="res" id="res" aria-live="polite"></section>
</main>
<footer><div class="wrap"><div class="row"><span>플레이앤 Play N</span><span>문의 <a href="tel:01083395818">010-8339-5818</a></span><a href="/hongdae/">홍대루프탑점</a><a href="/yeonnam/">연남루프탑점</a><a href="/yeontral/">연트럴파크점</a></div></div></footer>
<a class="fab" href="/help/"><i></i>AI 상담사</a>
<script>
const $=id=>document.getElementById(id);
/* 게임 정보: @playn_no.1 매거진에 정리한 내용 기준 (Steam 상점 페이지) */
const GAMES=[
 {n:"PEAK",min:1,max:4,v:["coop","laugh"],d:"한 명 미끄러지면 다 같이 위험한 협동 등반",m:20},
 {n:"Lethal Company",min:1,max:4,v:["scary","laugh","coop"],d:"버려진 위성에서 고철 주워 납품하는 공포 협동",m:7},
 {n:"R.E.P.O.",min:1,max:6,v:["laugh","coop","scary"],d:"비싼 물건 안 깨지게 들고 나오기",m:7},
 {n:"Overcooked! 2",min:1,max:4,v:["coop","laugh"],d:"한 화면 4인 주방 대혼란",m:6,local:true},
 {n:"Pummel Party",min:2,max:4,v:["fight","laugh"],d:"보드게임 + 미니게임 우정 파괴전",m:6},
 {n:"BOMBANANA!",min:3,max:3,v:["coop","laugh"],d:"셋이서 손짓·고함으로 폭탄 해체",m:14},
 {n:"낚시 방법 (How to Fish)",min:1,max:4,v:["coop","chill"],d:"낚시하다 저격총까지 드는 협동 게임",m:16},
 {n:"Among Us",min:4,max:15,v:["mind","laugh"],d:"4~15인 심리전, 한국어 지원",m:8},
 {n:"Golf With Your Friends",min:2,max:12,v:["chill","fight"],d:"최대 12인 미니 골프",m:8},
 {n:"Gang Beasts",min:2,max:8,v:["fight","laugh"],d:"온라인 최대 8인 젤리 막싸움",m:8},
 {n:"PICO PARK",min:2,max:8,v:["coop","laugh"],d:"2~8인 협동 퍼즐",m:8},
 {n:"Party Animals",min:2,max:8,v:["fight","laugh"],d:"강아지·고양이 물리 난투",m:8},
 {n:"구스구스덕",min:5,max:16,v:["mind","laugh"],d:"거위 사이 숨은 오리 찾기, 최대 16명 · 무료",free:true},
 {n:"SCP: Secret Laboratory",min:2,max:16,v:["scary"],d:"괴물 피해 탈출하는 멀티 공포 · 무료",free:true},
 {n:"슈퍼 애니멀 로얄",min:1,max:4,v:["fight","chill"],d:"귀여운 동물 배틀로얄 4인 스쿼드 · 무료",free:true},
 {n:"리그 오브 레전드 내전",min:2,max:10,v:["fight","esports"],d:"팀 나눠서 사용자 설정 게임, 5명씩 번갈아 하면 인원 제한 없음",free:true},
 {n:"리그 오브 레전드 5인 자유랭크",min:5,max:5,v:["esports"],d:"다섯이 한 팀으로 랭크 연승 도전",free:true},
 {n:"발로란트 5인 파티",min:2,max:5,v:["esports","fight"],d:"5인 파티로 경쟁전·신속 플레이",free:true},
 {n:"마리오카트 · 마리오파티 (스위치)",min:2,max:4,v:["laugh","fight","chill"],d:"TV 앞에서 다 같이, 홍대루프탑점",console:"h"},
 {n:"철권 (PS)",min:2,max:2,v:["fight"],d:"1대1 토너먼트로 돌리면 몇 명이든 OK, 철권 스틱 있는 연남",console:"y"},
];
const VIBES=[["laugh","웃다가 배 아프게"],["coop","다 같이 협동"],["fight","서로 때리는 난투"],["mind","눈치·심리전"],["scary","무서운 거"],["esports","진지하게 랭크·내전"],["chill","가볍게 수다 떨며"]];
const WHEN=[["day","낮에 잠깐 (11~17:30)"],["night","저녁부터 밤새 (19~익일 9:30)"],["full","하루 종일 (12~익일 10)"]];
let ppl=4,vibe="laugh",when="night",M=null;
function opts(el,list,cur,set){el.innerHTML="";list.forEach(([k,n])=>{const b=document.createElement("button");b.type="button";b.textContent=n;b.setAttribute("aria-pressed",k===cur);b.onclick=()=>{set(k);draw()};el.appendChild(b)})}
$("minus").onclick=()=>{ppl=Math.max(2,ppl-1);draw()};$("plus").onclick=()=>{ppl=Math.min(16,ppl+1);draw()};
const ymd=d=>d.toISOString().slice(0,10),add=(s,n)=>ymd(new Date(new Date(s+"T00:00:00Z").getTime()+n*864e5));
function tier(d){if(!M)return"A";if(M.force_c.includes(d.slice(5)))return"C";const off=x=>M.holidays.includes(x)||[0,6].includes(new Date(x+"T00:00:00Z").getUTCDay());const a=off(d),b=off(add(d,1));return!a&&!b?"A":!a&&b?"B":a&&b?"C":"D"}
function nextDay(t){const s=new Date(Date.now()+9*36e5);for(let i=0;i<14;i++){const d=add(ymd(s),i);if(tier(d)===t)return d}return ymd(s)}
function draw(){opts($("vibe"),VIBES,vibe,k=>vibe=k);opts($("when"),WHEN,when,k=>when=k);$("ppl").textContent=ppl+"명";
 const fit=GAMES.filter(g=>ppl>=g.min&&(ppl<=g.max||g.n.includes("철권")||g.n.includes("내전")))
  .map(g=>({...g,s:(g.v.includes(vibe)?10:0)+(g.v[0]===vibe?3:0)+(g.free?1:0)})).sort((a,b)=>b.s-a.s).slice(0,4);
 const big=ppl>=8, mid=ppl>=6;
 const br=ppl<=5?[["연트럴파크점","/yeontral/","5명 최적 · 320Hz 더블모니터 · 눕는 좌식 의자"],["연남루프탑점","/yeonnam/","RTX 4070 · 데스에더 V3 프로 · 루프탑"]]
  :ppl<=7?[["연남루프탑점","/yeonnam/","최대 16명 · 빔프로젝터 노래방 · 루프탑"],["홍대루프탑점","/hongdae/","PS5·스위치·75인치 TV · 루프탑 불멍"]]
  :[["홍대루프탑점","/hongdae/","최대 16명 · TV방 콘솔·보드게임 15종+"],["연남루프탑점","/yeonnam/","최대 16명 · 빔프로젝터 노래방"]];
 const extra=Math.max(0,ppl-5)*20000;
 const price=b=>{if(!M)return"";const p=M.prices?.[b]?.[when];if(!p)return"";const wk=p.A+extra,we=p.C+extra;return`평일 ${(wk/10000).toLocaleString()}만 · 토요일 ${(we/10000).toLocaleString()}만`};
 let tip="";
 if(mid)tip=`PC는 지점마다 5대예요. ${ppl}명이면 PC 게임은 5명씩 번갈아 하고, 나머지는 ${big?"TV방 콘솔·노래방·보드게임":"노래방·보드게임"}으로 돌리는 게 제일 재밌어요. 다 같이 할 땐 인원 제한 없는 게임(어몽어스·구스구스덕)을 각자 폰·노트북과 섞어도 좋아요.`;
 else if(ppl===5)tip="다섯 명이면 PC 5대를 딱 한 대씩. 롤 5인 자유랭크로 연승 도전해 보세요.";
 else tip=`${ppl}명이면 PC 한 대씩 쓰고도 자리가 남아요. 남는 자리에서 기어 라이브러리 장비를 바꿔가며 써보세요.`;
 $("res").innerHTML=`<h2 class="disp">${ppl}명 · ${VIBES.find(x=>x[0]===vibe)[1]}</h2><p class="lead">추천 게임 라인업이에요. 매거진에 자세한 소개가 있어요.</p>
  <div class="games">${fit.map(g=>`<div class="gm"><b>${g.n}</b><div class="m">${g.min===g.max?g.max+"명":g.min+"~"+g.max+"명"}${g.free?" · 무료":""}${g.local?" · 한 화면":""}</div><p>${g.d}</p>${g.m?`<a href="/m/${g.m}/">매거진에서 보기</a>`:""}</div>`).join("")}</div>
  <div class="tip">${tip}</div>
  <div class="pick">${br.map(([n,u,d])=>`<div class="card"><span class="k">추천 지점</span><b>${n}</b><p class="sub" style="font-size:14px;color:var(--mute)">${d}</p><div class="p">${price(n)}</div><a href="${u}" style="color:var(--lamp);font-size:14px;font-weight:700">지점 자세히 보기</a></div>`).join("")}</div>
  <p class="note" style="color:var(--dim);font-size:13px;margin-top:8px">${WHEN.find(x=>x[0]===when)[1]} 패키지 기준${extra?` · 6번째 사람부터 1명당 2만원 포함`:""} · 보증금 20만원 별도</p>
  <div class="acts"><a class="btn pink" href="/?branch=${encodeURIComponent(br[0][0])}#deals">이번 주 멤버 특가로 보기</a><button class="btn ghost" type="button" id="share">친구한테 보내기</button></div>`;
 $("share").onclick=async()=>{const t=`${ppl}명이서 ${fit.slice(0,3).map(g=>g.n).join(", ")} 어때? 플레이앤 ${br[0][0]}`;const u="https://playn.kr/plan/";
  try{if(navigator.share){await navigator.share({title:"오늘 뭐 하지?",text:t,url:u})}else{await navigator.clipboard.writeText(t+" "+u);$("share").textContent="복사했어요"}}catch(e){}};
}
draw();
fetch("https://bjrgtoyjrggxmdexnwib.supabase.co/functions/v1/playn-posts?meta=1").then(r=>r.json()).then(j=>{M=j;draw()}).catch(()=>{});
</script>
</body></html>
