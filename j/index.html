<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16133F">
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="/assets/base.css">
<title>다 같이 N CREW 가입하고 1시간 무료 연장 | 플레이앤</title>
<meta property="og:title" content="우리 다 같이 가입하면 퇴실 1시간 무료 연장!">
<meta property="og:description" content="플레이앤 N CREW 1분 가입 · 인원이 다 차면 자동으로 연장돼요.">
<style>
.tw{max-width:520px;margin:24px auto 60px}
.hd{border-radius:22px;padding:22px;background:radial-gradient(120% 90% at 85% 0%,#FF4FA3 0%,#3B1F6E 50%,#16133F 100%);color:#fff}
.hd small{font-weight:800;letter-spacing:.06em;opacity:.85}.hd h1{font-size:26px;margin:8px 0 0;line-height:1.3}.hd h1 b{color:#7CF5B8}
.bar{height:14px;border-radius:99px;background:rgba(255,255,255,.18);margin-top:14px;overflow:hidden}.bar i{display:block;height:100%;background:#7CF5B8;border-radius:99px;transition:width .4s}
.hd p{margin:8px 0 0;font-size:14.5px;opacity:.92;line-height:1.55}
.fm{margin-top:14px;background:var(--ink);color:var(--night);border-radius:var(--r-lg);padding:18px}
.fm label.t{display:block;font-weight:800;font-size:14.5px;margin:12px 0 6px}.fm label.t:first-child{margin-top:0}
.fm input[type=text],.fm input[type=tel]{width:100%;border:1.5px solid #CFCBF0;border-radius:12px;padding:12px;font:16px Pretendard,sans-serif}
.row{display:grid;grid-template-columns:1fr auto;gap:8px}.row button{border:0;border-radius:12px;padding:0 14px;background:#16133F;color:#fff;font:700 14px Pretendard;cursor:pointer;white-space:nowrap}
.ck{display:flex;gap:8px;align-items:flex-start;font-weight:700;margin-top:10px;line-height:1.45}.ck small{display:block;font-weight:500;color:#5B5790}
.msg{margin-top:12px;border-radius:12px;padding:12px 14px;font-weight:700;line-height:1.55}.msg.ok{background:#DDF7EA;color:#14532D}.msg.er{background:#FFE1E6;color:#8A1030}
.go{width:100%;margin-top:14px;display:flex}
</style>
<script src="/assets/pv.js" defer></script>
</head><body>
<header class="top"><div class="wrap"><a class="logo" href="/">PLAY <b>N</b></a></div></header>
<main class="wrap"><div class="tw">
  <section class="hd">
    <small>PLAY N · N CREW 다 같이 가입</small>
    <h1 id="h">불러오는 중…</h1>
    <div class="bar"><i id="bar" style="width:0"></i></div>
    <p id="pg"></p>
  </section>
  <form class="fm" id="fm" hidden autocomplete="on">
    <label class="t" for="nm">이름</label>
    <input id="nm" type="text" autocomplete="name" placeholder="홍길동" required>
    <label class="t" for="ph">휴대폰 번호</label>
    <div class="row"><input id="ph" type="tel" inputmode="numeric" autocomplete="tel" placeholder="010-0000-0000" required><button type="button" id="otp">인증번호 받기</button></div>
    <label class="t" for="cd">인증번호 6자리</label>
    <input id="cd" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="문자로 받은 숫자">
    <label class="ck"><input type="checkbox" id="ag"><span>N CREW 가입 (무료) · 특가·이벤트 알림 수신에 동의해요 (필수)<small>빈자리 특가 20% · 방문할수록 등급 혜택. 수집: 이름·휴대폰 번호 / 목적: 특가·이벤트 알림 / 보관: 수신 거부 시까지. 언제든 playn.kr 맨 아래에서 수신 거부할 수 있어요.</small></span></label>
    <label class="ck"><input type="checkbox" id="nt"><span>밤 9시~아침 8시 당일 특가 알림도 받을게요<small>(선택)</small></span></label>
    <button class="btn pink go" id="go" type="submit">가입하고 인증 완료</button>
    <div id="m"></div>
  </form>
</div></main>
<script>
const API="https://bjrgtoyjrggxmdexnwib.supabase.co/functions/v1/playn-settle";
const $=id=>document.getElementById(id);
const g=new URLSearchParams(location.search).get("g")||"";
const post=b=>fetch(API,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({...b,g})}).then(r=>r.json());
const hm=t=>t?t.slice(11,16):"";
let done=false;
function msg(t,ok){$("m").innerHTML=`<div class="msg ${ok?"ok":"er"}">${t}</div>`}
function paint(r){
  const pct=Math.min(100,Math.round(r.joined/Math.max(1,r.need)*100));$("bar").style.width=pct+"%";
  if(r.status==="done"){$("h").innerHTML=r.result==="ext"?`🎉 <b>무료 연장 확정!</b><br>퇴실 ${hm(r.new_end)}`:`🎉 <b>전원 가입 완료!</b>`;$("pg").innerHTML=r.result==="ext"?"대표님 휴대폰으로 확정 문자가 갔어요. 즐거운 시간 보내세요!":`${r.alt}<br>퇴실 정산 때 자동으로 빠져요.`;$("fm").hidden=true;return}
  if(r.status==="completing"){$("h").innerHTML="⏳ 전원 가입 완료!<br>연장 처리 중이에요";$("pg").textContent="1분 안에 대표님께 확정 문자가 가요.";$("fm").hidden=true;return}
  $("h").innerHTML=r.mode==="ext"?`다 같이 가입하면<br>퇴실 <b>${hm(r.orig_end)} → ${hm(r.new_end)}</b> 무료 연장`:`다 같이 가입하면<br><b>봉투비·일회용품 무료</b><br>+ 다음 방문 1시간 연장권`;
  $("pg").innerHTML=`${r.branch} · <b>${r.joined}/${r.need}명</b> 가입 완료${done?" · 나는 가입 완료 ✅":""}<br>${r.mode==="ext"?"마지막 한 명까지 가입하면 자동으로 연장돼요.":r.alt}`;
  $("fm").hidden=done}
async function load(){
  if(!g){$("h").textContent="대표님 화면의 QR을 다시 찍어주세요";return}
  const r=await post({action:"fx_info"}).catch(()=>null);
  if(!r||!r.ok){$("h").textContent=(r&&r.error)||"잠시 후 다시 시도해 주세요";return}
  paint(r);if(r.status==="open"||r.status==="completing")setTimeout(load,8000)}
$("otp").onclick=async()=>{const ph=$("ph").value.replace(/\D/g,"");if(!/^01\d{8,9}$/.test(ph))return msg("휴대폰 번호를 확인해 주세요");
  $("otp").disabled=true;const r=await post({action:"fx_otp",phone:ph}).catch(()=>({ok:false,error:"연결이 불안정해요"}));
  if(!r.ok){$("otp").disabled=false;return msg(r.error||"다시 시도해 주세요")}
  msg("인증번호를 문자로 보냈어요 (5분 안에 입력)",true);setTimeout(()=>{$("otp").disabled=false;$("otp").textContent="다시 받기"},30000);$("cd").focus()};
$("fm").onsubmit=async e=>{e.preventDefault();
  if(!$("ag").checked)return msg("N CREW 가입 동의(필수)를 체크해 주세요");
  if(!/^\d{6}$/.test($("cd").value.trim()))return msg("문자로 받은 인증번호 6자리를 입력해 주세요");
  $("go").disabled=true;
  const r=await post({action:"fx_join",name:$("nm").value,phone:$("ph").value,code:$("cd").value,agree:true,night_agree:$("nt").checked}).catch(()=>({ok:false,error:"연결이 불안정해요. 다시 눌러주세요"}));
  $("go").disabled=false;
  if(!r.ok)return msg(r.error||"다시 시도해 주세요");
  if(r.closed){paint(r);return}
  done=true;msg(`${r.me||""}님 N CREW 가입 완료! 🎉`,true);paint(r)};
load();
</script>
</body></html>
