<style>
/* 2026-11-14 시안 v2: 가독성 개편 (내용·금액은 /guide 와 같음) */
.gw{max-width:620px;margin:0 auto;padding-bottom:56px;font-size:16px}
.gw h1{font-size:30px;margin-top:20px}
.addr{margin-top:6px;color:var(--mute);line-height:1.55}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:14px}
.tabs a{min-height:44px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:var(--panel);color:var(--mute);text-decoration:none;font:700 14.5px Pretendard,sans-serif;text-align:center;padding:0 6px}
.tabs a[aria-current=page]{background:var(--ink);color:var(--night)}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.fact{background:var(--panel);border-radius:14px;padding:12px 14px}
.fact b{display:block;font:400 22px "Black Han Sans",Pretendard,sans-serif;color:var(--ink);margin-top:2px}
.fact small{color:var(--mute);font-size:13px;font-weight:600}
.fact.wide{grid-column:1/-1}
.fact.wide b{font:700 15px/1.6 Pretendard,sans-serif}
.must{margin-top:18px;border-radius:18px;padding:18px;background:linear-gradient(160deg,#2A2560,#211D57);border:1.5px solid rgba(255,181,71,.5)}
.must h2{font-size:21px;color:var(--lamp)}
.must ol{list-style:none;margin:12px 0 0;padding:0;counter-reset:m}
.must li{counter-increment:m;position:relative;padding:0 0 14px 40px;line-height:1.55}
.must li:last-child{padding-bottom:0}
.must li::before{content:counter(m);position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;background:var(--lamp);color:#1a1300;font:800 15px/28px Pretendard,sans-serif;text-align:center}
.must li b{display:block;font-size:16.5px}
.must li span{color:var(--mute);font-size:15px}
.must .btn{margin-top:8px}
.steps{position:sticky;top:58px;z-index:5;background:var(--night);display:flex;gap:6px;overflow-x:auto;margin:22px -16px 0;padding:8px 16px;border-bottom:1px solid var(--line)}
.steps a{flex:none;min-height:40px;display:inline-flex;align-items:center;gap:6px;padding:0 14px;border-radius:999px;background:var(--panel);color:var(--mute);text-decoration:none;font:700 14px Pretendard,sans-serif}
.steps a i{font-style:normal;color:var(--lamp);font-family:"Black Han Sans",sans-serif}
.sec{margin-top:30px;scroll-margin-top:120px}
.sec>h2{display:flex;align-items:baseline;gap:10px;font-size:25px}
.sec>h2 i{font-style:normal;color:var(--brand)}
.sec>p.lead{margin-top:6px;color:var(--mute);line-height:1.6}
.rows{margin-top:12px;border-radius:16px;background:var(--panel);overflow:hidden}
.row{display:flex;gap:12px;padding:14px 16px;border-top:1px solid var(--line);line-height:1.6}
.row:first-child{border-top:0}
.row svg{flex:none;width:22px;height:22px;margin-top:2px;stroke:var(--lamp);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.row b{display:block}
.row span{color:var(--mute);font-size:15px}
details.sp{margin-top:10px;border-radius:16px;background:var(--panel);overflow:hidden}
details.sp>summary{list-style:none;cursor:pointer;min-height:56px;display:flex;align-items:center;gap:12px;padding:12px 16px;font:800 17px Pretendard,sans-serif}
details.sp>summary::-webkit-details-marker{display:none}
details.sp>summary svg{width:24px;height:24px;stroke:var(--lamp);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
details.sp>summary em{margin-left:auto;font-style:normal;color:var(--dim);font-size:13px;font-weight:600}
details.sp>summary::after{content:"";width:10px;height:10px;border-right:2px solid var(--mute);border-bottom:2px solid var(--mute);transform:rotate(45deg);margin:-4px 4px 0 6px;transition:transform .2s}
details.sp[open]>summary::after{transform:rotate(-135deg);margin-top:4px}
.sp .in{padding:0 16px 16px}
.sp ul{margin:0;padding:0;list-style:none}
.sp ul li{position:relative;padding:9px 0 9px 18px;border-top:1px solid var(--line);line-height:1.6}
.sp ul li:first-child{border-top:0}
.sp ul li::before{content:"";position:absolute;left:2px;top:19px;width:6px;height:6px;border-radius:50%;background:var(--brand)}
.sp ul li.no::before{background:#FF5A5F;width:8px;height:2px;border-radius:0;top:21px}
.sp h3{font:800 15px Pretendard,sans-serif;color:var(--lamp);margin:14px 0 4px}
.sp ol.how{margin:6px 0 0;padding:0;list-style:none;counter-reset:h}
.sp ol.how li{counter-increment:h;position:relative;padding:8px 0 8px 32px;line-height:1.55}
.sp ol.how li::before{content:counter(h);position:absolute;left:0;top:8px;width:22px;height:22px;border-radius:6px;background:var(--panel2,#241F63);border:1px solid var(--line);color:var(--ink);font:800 13px/22px Pretendard,sans-serif;text-align:center}
.sp img{width:100%;height:auto;border-radius:12px;margin-top:10px;display:block;background:var(--night)}
.ph{margin-top:8px}
.ph summary{cursor:pointer;color:var(--lamp);font-weight:700;font-size:14.5px;min-height:40px;display:flex;align-items:center}
.ck{margin-top:12px;border-radius:16px;background:var(--panel);padding:6px 0}
.ck label{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;line-height:1.55;cursor:pointer;min-height:44px}
.ck input{flex:none;width:22px;height:22px;margin-top:1px;accent-color:var(--lamp)}
.ck input:checked+span{color:var(--dim);text-decoration:line-through}
.prog{margin-top:10px;color:var(--mute);font-size:14px;font-weight:600}
table.t{width:100%;border-collapse:collapse;margin-top:12px;font-size:15px;background:var(--panel);border-radius:16px;overflow:hidden}
table.t th,table.t td{padding:11px 12px;text-align:left;vertical-align:top;line-height:1.5;border-top:1px solid var(--line)}
table.t tr:first-child th,table.t tr:first-child td{border-top:0}
table.t thead th{color:var(--mute);font-size:13px;font-weight:700;background:rgba(255,255,255,.03)}
table.t td.n{white-space:nowrap;font-weight:800;text-align:right}
table.t td.bad{color:#FF8A8E;font-weight:700}
.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.flow div{background:var(--panel);border-radius:12px;padding:10px 8px;text-align:center;font-size:13.5px;line-height:1.4;font-weight:600;color:var(--mute)}
.flow div b{display:block;color:var(--lamp);font:400 18px "Black Han Sans",sans-serif;margin-bottom:2px}
.note{margin-top:10px;border-radius:14px;padding:13px 15px;line-height:1.6;background:var(--panel);font-size:15px}
.note.r{background:rgba(255,90,95,.14)}.note.b{background:rgba(143,163,255,.14)}.note.p{background:rgba(255,46,110,.12)}.note.y{background:rgba(255,181,71,.14)}
.note a{color:var(--lamp);font-weight:700}
.perk{display:grid;gap:8px;margin-top:12px}
.perk div{background:var(--panel);border-radius:14px;padding:14px 16px;line-height:1.55}
.perk b{color:var(--ink)}
.perk span{display:block;color:var(--mute);font-size:14.5px;margin-top:2px}
.sig{margin-top:30px;color:var(--mute);font-size:14.5px;line-height:1.75;border-top:1px solid var(--line);padding-top:16px}
.btn:focus-visible,.tabs a:focus-visible,.steps a:focus-visible,summary:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
@media(prefers-reduced-motion:reduce){details.sp>summary::after{transition:none}}
</style>
