<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Play N AI 상담사</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#0B0B10">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--bg:#0B0B10;--card:#16161E;--line:#2A2A36;--fg:#F2F2F7;--mute:#9A9AAA;--pink:#FF2E6E;--cyan:#3DF2FF;--me:#FF2E6E}
*{box-sizing:border-box;margin:0;padding:0}[hidden]{display:none!important}
html,body{height:100%;background:var(--bg);color:var(--fg);font-family:Pretendard,-apple-system,sans-serif;-webkit-text-size-adjust:100%}
body{display:flex;flex-direction:column;max-width:560px;margin:0 auto}
header{padding:14px 16px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;position:sticky;top:0;background:var(--bg);z-index:2}
.logo{font-weight:900;font-size:20px;letter-spacing:-.5px}.logo b{color:var(--pink)}
.br{font-size:13px;color:var(--mute);margin-left:auto;border:1px solid var(--line);border-radius:999px;padding:5px 11px;background:none;color:var(--mute);font-family:inherit}
main{flex:1;overflow-y:auto;padding:16px 16px 8px}
.msg{max-width:86%;padding:11px 14px;border-radius:16px;line-height:1.55;font-size:15.5px;margin:6px 0;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.bot{background:var(--card);border:1px solid var(--line);border-top-left-radius:6px}
.me{background:var(--me);color:#fff;margin-left:auto;border-top-right-radius:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px}
.chip{border:1px solid var(--line);background:#12121A;color:var(--fg);border-radius:999px;padding:9px 13px;font-size:14px;font-family:inherit}
.chip:active{background:#1E1E2A}
.esc{background:#1A0F14;border:1px solid #5A1B2E;border-radius:14px;padding:12px;margin:8px 0;max-width:86%}
.esc p{font-size:14px;color:#FFB3C8;margin-bottom:10px}
.esc a{display:inline-block;margin-right:8px;background:var(--pink);color:#fff;text-decoration:none;border-radius:10px;padding:9px 14px;font-size:14px;font-weight:700}
.esc a.s{background:#2A2A36}
.typing{color:var(--mute);font-size:14px;margin:8px 2px}
form{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--bg);position:sticky;bottom:0}
textarea{flex:1;resize:none;background:#12121A;color:var(--fg);border:1px solid var(--line);border-radius:14px;padding:11px 13px;font-size:16px;font-family:inherit;max-height:120px;line-height:1.4}
button.send{background:var(--pink);color:#fff;border:0;border-radius:14px;padding:0 16px;font-size:15px;font-weight:800;font-family:inherit}
button.send:disabled{opacity:.4}
.pick{padding:28px 16px}
.pick h1{font-size:24px;font-weight:900;letter-spacing:-1px;margin-bottom:6px}
.pick p{color:var(--mute);margin-bottom:20px;font-size:15px}
.pick button{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:14px;padding:16px;margin-bottom:10px;font-size:17px;font-weight:700;font-family:inherit}
.pick button span{display:block;font-size:13px;color:var(--mute);font-weight:500;margin-top:3px}
.note{font-size:12px;color:#6E6E7E;text-align:center;padding:4px 0 2px}
</style>
<script src="/assets/pv.js" defer></script>
</head>
<body>
<header><div class="logo">PLAY <b>N</b> · AI 상담사</div><button class="br" id="brBtn" hidden></button></header>
<main id="log"></main>
<form id="f" hidden><textarea id="q" rows="1" placeholder="궁금한 점이나 문제를 적어주세요" enterkeyhint="send"></textarea><button class="send" id="sendBtn">전송</button></form>
<script>
const API="https://bjrgtoyjrggxmdexnwib.supabase.co/functions/v1/playn-chat";
const BR={hongdae:{n:"홍대루프탑점",a:"동교동 · 몽달건물 4층"},yeonnam:{n:"연남루프탑점",a:"동교동 · 꼬꼬순이건물 3층"},yeontral:{n:"연트럴파크점",a:"연남동 · 계림빌딩 5층"}};
const CHIPS={common:["에어컨이 안 켜져요","모니터 화면이 안 나와요","헤드셋 소리가 안 나요","노래방은 어떻게 해요?","셀프결제 물품 가격","퇴실 전 체크리스트"],
hongdae:["루프탑 조명 켜는 법","가스레인지가 안 켜져요"],yeonnam:["빔프로젝터 켜는 법","콘솔 연결 방법"],yeontral:["화장실은 어디예요?","빔프로젝터 켜는 법"]};
const log=document.getElementById('log'),f=document.getElementById('f'),q=document.getElementById('q'),sendBtn=document.getElementById('sendBtn'),brBtn=document.getElementById('brBtn');
let b=new URLSearchParams(location.search).get('b');let msgs=[];let sid=Math.random().toString(36).slice(2,10);let busy=false;
function el(t,c,txt){const e=document.createElement(t);if(c)e.className=c;if(txt!=null)e.textContent=txt;return e}
function scroll(){log.scrollTop=log.scrollHeight}
function add(role,text){log.appendChild(el('div','msg '+(role==='user'?'me':'bot'),text));scroll()}
function escCard(host){const d=el('div','esc');d.appendChild(el('p',null,'호스트에게 바로 연결할 수 있어요'));const t=host.replace(/-/g,'');
const a=el('a',null,'📞 전화하기');a.href='tel:'+t;const s=el('a','s','💬 문자 보내기');s.href='sms:'+t;d.append(a,s);log.appendChild(d);scroll()}
function chips(){const d=el('div','chips');[...CHIPS.common,...(CHIPS[b]||[])].forEach(c=>{const x=el('button','chip',c);x.type='button';x.onclick=()=>send(c);d.appendChild(x)});log.appendChild(d);scroll()}
function pick(){f.hidden=true;brBtn.hidden=true;log.innerHTML='';const p=el('div','pick');p.appendChild(el('h1',null,'어느 지점을 이용 중이세요?'));p.appendChild(el('p',null,'지점을 고르면 그 지점 안내에 맞춰 답변해 드려요.'));
Object.entries(BR).forEach(([k,v])=>{const x=el('button',null,v.n);x.appendChild(el('span',null,v.a));x.onclick=()=>{history.replaceState(null,'','?b='+k);b=k;start()};p.appendChild(x)});log.appendChild(p)}
function start(){if(!BR[b])return pick();log.innerHTML='';msgs=[];f.hidden=false;brBtn.hidden=false;brBtn.textContent=BR[b].n+' ▾';
add('assistant','안녕하세요! 플레이앤 '+BR[b].n+' AI 상담사예요 🎮\n이용 방법이나 장비 문제를 물어보시면 바로 도와드릴게요.\n해결이 안 되면 호스트에게 연결해 드려요.');chips();
log.appendChild(el('div','note','AI가 안내사항을 바탕으로 답해요. 보증금·환불·연장은 호스트가 확정해요.'))}
async function send(text){text=(text||'').trim();if(!text||busy)return;busy=true;sendBtn.disabled=true;q.value='';q.style.height='';
add('user',text);msgs.push({role:'user',content:text});const t=el('div','typing','답변 작성 중…');log.appendChild(t);scroll();
try{const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({b,sid,messages:msgs})});const j=await r.json();t.remove();
const ans=j.answer||'잠시 연결이 원활하지 않아요. 호스트에게 연락 주세요.';add('assistant',ans);msgs.push({role:'assistant',content:ans});if(j.escalate)escCard(j.host||'010-8339-5818')}
catch(e){t.remove();add('assistant','네트워크가 불안정해요. 잠시 후 다시 시도하시거나 호스트에게 연락 주세요.');escCard('010-8339-5818')}
busy=false;sendBtn.disabled=false}
f.onsubmit=e=>{e.preventDefault();send(q.value)};
q.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send(q.value)}});
q.addEventListener('input',()=>{q.style.height='';q.style.height=Math.min(q.scrollHeight,120)+'px'});
brBtn.onclick=()=>{history.replaceState(null,'',location.pathname);b=null;pick()};
start();
</script>
</body>
</html>
