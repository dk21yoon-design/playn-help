<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Play N 도움 QR 카드</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Pretendard,-apple-system,sans-serif;background:#EDEDF2;color:#0B0B10;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.bar{position:sticky;top:0;background:#0B0B10;color:#F2F2F7;padding:12px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;z-index:2}
.bar b{font-weight:900;margin-right:6px}.bar b i{color:#FF2E6E;font-style:normal}
.bar button{border:1px solid #3A3A48;background:#16161E;color:#F2F2F7;border-radius:999px;padding:8px 13px;font:600 14px Pretendard,sans-serif}
.bar button.on{background:#FF2E6E;border-color:#FF2E6E}
.bar .pr{margin-left:auto;background:#3DF2FF;color:#0B0B10;border:0;font-weight:800}
.hint{max-width:210mm;margin:12px auto 0;padding:0 16px;color:#55556A;font-size:13px;line-height:1.5}
.sheet{width:210mm;min-height:297mm;margin:12px auto 24px;background:#fff;padding:10mm;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:8mm;box-shadow:0 2px 12px rgba(0,0,0,.08)}
.card{border:2px solid #0B0B10;border-radius:6mm;padding:7mm 6mm;display:flex;flex-direction:column;align-items:center;text-align:center;position:relative;overflow:hidden}
.card:before{content:"";position:absolute;left:0;right:0;top:0;height:3mm;background:#FF2E6E}
.card.sos:before{background:#C8102E}
.logo{font-weight:900;font-size:13pt;letter-spacing:-.3px}.logo i{color:#FF2E6E;font-style:normal}
.br{font-size:9pt;color:#55556A;margin-top:1mm}
h2{font-size:19pt;font-weight:900;letter-spacing:-.8px;margin:5mm 0 2mm;line-height:1.2;word-break:keep-all}
.sub{font-size:10pt;color:#33334A;line-height:1.45;word-break:keep-all}
.qr{margin:5mm 0 3mm;padding:2mm;background:#fff}
.qr img,.qr canvas{width:40mm!important;height:40mm!important;display:block}
.scan{font-size:9.5pt;font-weight:700}
.foot{margin-top:auto;padding-top:3mm;font-size:8.5pt;color:#55556A;line-height:1.45;word-break:keep-all}
.foot b{color:#C8102E}
@media (max-width:820px){.sheet{width:auto;min-height:0;margin:12px;grid-template-columns:1fr}.hint{padding:0 12px}}
@media print{@page{size:A4;margin:0}body{background:#fff}.bar,.hint{display:none}.sheet{margin:0;box-shadow:none;page-break-after:always;width:210mm;height:297mm}}
</style>
</head>
<body>
<div class="bar"><b>PLAY <i>N</i> 도움 QR 카드</b><span id="tabs"></span><button class="pr" onclick="print()">인쇄</button></div>
<p class="hint">A4 한 장에 카드 4장이에요. 잘라서 ① 입구 안쪽 ② 도어락 옆 ③ 에어컨 리모컨 옆 ④ PC 책상에 붙이세요. 스캔하면 그 지점 AI 상담사가 열리고, ②③④는 질문이 자동으로 들어가요.</p>
<div id="out"></div>
<script>
const HOST='010-8339-5818',BASE='https://playn.kr/help/';
const BR={hongdae:'홍대루프탑점',yeonnam:'연남루프탑점',yeontral:'연트럴파크점'};
const CARDS=[
 {t:'문제가 생겼나요?',s:'장비·이용 방법·퇴실 안내까지\nAI 상담사가 바로 답해요',q:''},
 {t:'도어락 경보가\n울리면',s:'당황하지 말고 스캔하세요\n끄는 방법을 바로 알려드려요',q:'도어락 경보가 울려요'},
 {t:'에어컨·난방이\n안 되면',s:'리모컨 설정부터\n차근차근 알려드려요',q:'에어컨이 안 켜져요'},
 {t:'모니터·헤드셋이\n안 되면',s:'PC·장비 연결 문제를\n바로 해결해 드려요',q:'모니터 화면이 안 나와요'}
];
const tabs=document.getElementById('tabs'),out=document.getElementById('out');
let sel=new URLSearchParams(location.search).get('b');if(sel!=='all'&&!BR[sel])sel='all';
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function render(){
 tabs.innerHTML='';[['all','전체'],...Object.entries(BR)].forEach(([k,n])=>{const b=el('button',k===sel?'on':'',n);b.onclick=()=>{sel=k;history.replaceState(null,'','?b='+k);render()};tabs.appendChild(b)});
 out.innerHTML='';
 (sel==='all'?Object.keys(BR):[sel]).forEach(k=>{
  const sh=el('div','sheet');
  CARDS.forEach((c,i)=>{
   const d=el('div','card'+(i===1?' sos':''));
   const lg=el('div','logo');lg.innerHTML='PLAY <i>N</i>';d.appendChild(lg);
   d.appendChild(el('div','br',BR[k]));
   const h=el('h2');h.textContent=c.t;h.style.whiteSpace='pre-line';d.appendChild(h);
   const s=el('div','sub',c.s);s.style.whiteSpace='pre-line';d.appendChild(s);
   const qb=el('div','qr');d.appendChild(qb);
   const url=BASE+'?b='+k+(c.q?'&q='+encodeURIComponent(c.q):'');
   new QRCode(qb,{text:url,width:320,height:320,correctLevel:QRCode.CorrectLevel.M});
   d.appendChild(el('div','scan','카메라로 스캔'));
   const f=el('div','foot');f.innerHTML='해결이 안 되면 호스트 '+HOST+'<br><b>불꽃·연기·가스 냄새는 즉시 대피 후 119</b>';d.appendChild(f);
   sh.appendChild(d)});
  out.appendChild(sh)})}
render();
</script>
</body>
</html>
