<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Play N HQ 운영 관제실</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0E0C2C">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="icons.js"></script>
<style>
/* Play N HQ: 플레이앤 홈의 '루프탑 밤' 무드를 그대로 쓰는 관제실.
   읽는 순서 = ① 전체 상태 한 줄 ② 오늘 숫자 5개 ③ 카테고리(브랜드) 카드 ④ 이슈 ⑤ 발행·성과 ⑥ 자동화 ⑦ 활동·할 일·스킬.
   색 규칙: 앰버=강조 1개, 핑크=브랜드, 초록/주황/빨강=상태 전용(장식에 안 씀). 다크 고정(브랜드가 '밤'). */
:root{
  --deep:#0E0C2C;--night:#16133F;--panel:#1C1850;--panel2:#241F63;--line:rgba(166,162,214,.16);--line2:rgba(166,162,214,.3);
  --ink:#F3F1FF;--mute:#B3AFDF;--dim:#8F8BC4;--lamp:#FFB547;--brand:#FF2E6E;
  --ok:#3DDC97;--warn:#FFB547;--crit:#FF5A5F;--info:#8FA3FF;
  --r:16px;--r-sm:10px;--ease:cubic-bezier(.16,1,.3,1);
  --f-body:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-disp:"Black Han Sans",Pretendard,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:120px}
body{background:var(--deep);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;word-break:keep-all;-webkit-font-smoothing:antialiased;min-height:100vh;
  background-image:radial-gradient(900px 500px at 85% -10%,rgba(255,181,71,.10),transparent 60%),radial-gradient(700px 500px at -10% 10%,rgba(255,46,110,.08),transparent 60%)}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--lamp);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* 상단바 */
.top{position:sticky;top:0;z-index:20;background:rgba(14,12,44,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top .wrap{display:flex;align-items:center;gap:14px;height:58px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo img{width:30px;height:30px;border-radius:8px}
.logo b{font-family:var(--f-disp);font-weight:400;font-size:20px;letter-spacing:.5px}
.logo span{white-space:nowrap;font-size:12px;color:var(--mute);border:1px solid var(--line2);border-radius:999px;padding:1px 8px}
.live{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(61,220,151,.6);animation:pulse 2s infinite}
.dot.off{background:var(--dim);animation:none}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(61,220,151,0)}100%{box-shadow:0 0 0 0 rgba(61,220,151,0)}}
.btn-ghost{border:1px solid var(--line2);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--mute)}
.btn-ghost:hover{color:var(--ink);border-color:var(--mute)}

/* 카테고리 탭 */
.cats{position:sticky;top:calc(58px + env(safe-area-inset-top,0px));z-index:19;background:rgba(14,12,44,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.cats .wrap{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-block:10px}
.cats .wrap::-webkit-scrollbar{display:none}
.cat{text-decoration:none;display:flex;align-items:center;gap:7px;flex:none;padding:7px 13px 7px 8px;border-radius:999px;border:1px solid var(--line);color:var(--mute);font-size:14px;font-weight:600;transition:.25s var(--ease)}
.cat img,.cat .mono{width:22px;height:22px;border-radius:6px;flex:none}
.cat:hover{color:var(--ink);border-color:var(--line2)}
.cat.on{background:var(--ink);color:var(--deep);border-color:var(--ink)}
.cat .n{min-width:18px;height:18px;border-radius:9px;background:var(--crit);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 5px}
.cat .n.w{background:var(--warn);color:#2A1A00}

main{display:flex;flex-direction:column;gap:44px;padding-block:28px 80px}
section{display:flex;flex-direction:column;gap:16px;animation:rise .6s var(--ease) both}
@keyframes rise{from{transform:translateY(10px)}}
.sh{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.sh h2{font-family:var(--f-disp);font-weight:400;font-size:24px;letter-spacing:.3px}
.sh .eye{font-size:12px;letter-spacing:.14em;color:var(--lamp);font-weight:700}
.sh .meta{margin-left:auto;font-size:13px;color:var(--dim)}

/* 상태 배너 */
.status{border-radius:var(--r);padding:22px 24px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;border:1px solid var(--line2);background:linear-gradient(120deg,rgba(61,220,151,.16),rgba(61,220,151,.04))}
.status.warn{background:linear-gradient(120deg,rgba(255,181,71,.18),rgba(255,181,71,.04))}
.status.crit{background:linear-gradient(120deg,rgba(255,90,95,.2),rgba(255,90,95,.05))}
.status .big{font-family:var(--f-disp);font-size:clamp(24px,4.4vw,36px);line-height:1.15;text-wrap:balance}
.status .sub{color:var(--mute);font-size:14px}
.status .ico{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:24px;flex:none;background:var(--ok);color:#06281A}
.status.warn .ico{background:var(--warn);color:#2A1A00}.status.crit .ico{background:var(--crit);color:#fff}
.status .txt{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.status .go{border:1px solid var(--line2);border-radius:999px;padding:8px 16px;font-weight:700;font-size:14px;text-decoration:none;white-space:nowrap}

/* KPI 띠 */
.kpis{display:grid;grid-template-columns:repeat(5,1fr);background:var(--night);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpi{padding:16px 18px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi:last-child{border-right:0}
.kpi .l{font-size:12px;color:var(--mute);letter-spacing:.04em}
.kpi .v{font-size:30px;font-weight:800;letter-spacing:-.5px;line-height:1.2}
.kpi .s{font-size:12.5px;color:var(--dim)}
.up{color:var(--ok)}.down{color:var(--crit)}
@media (max-width:820px){.kpis{grid-template-columns:repeat(2,1fr)}.kpi{border-bottom:1px solid var(--line)}.kpi:nth-child(2n){border-right:0}.kpi:last-child{grid-column:1/-1}}

/* 브랜드 카드 */
.brands{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.bc{position:relative;text-decoration:none;color:inherit;text-align:left;background:linear-gradient(180deg,var(--panel),var(--night));border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px;transition:transform .35s var(--ease),border-color .35s}
.bc:hover{transform:translateY(-3px);border-color:var(--line2)}
.bc .hd{display:flex;align-items:center;gap:12px}
.blogo{width:48px;height:48px;border-radius:13px;flex:none;object-fit:cover;background:var(--panel2)}
.mono{display:grid;place-items:center;font-family:var(--f-disp);color:#fff}
.bc h3{font-size:17px;font-weight:800;line-height:1.3}
.bc .tag{font-size:12.5px;color:var(--mute)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{color:var(--ok);background:rgba(61,220,151,.12)}.pill.warn{color:var(--warn);background:rgba(255,181,71,.12)}.pill.crit{color:var(--crit);background:rgba(255,90,95,.14)}.pill.idle{color:var(--dim);background:rgba(143,139,196,.12)}
.bc .hd .pill{margin-left:auto}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mini div{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 10px;min-width:0}
.mini b{display:block;font-size:19px;font-weight:800;line-height:1.25}
.mini span{font-size:11.5px;color:var(--mute);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plats{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pi{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:rgba(255,255,255,.06);border:1px solid var(--line)}
.pi svg{width:16px;height:16px}
.bc .more{margin-left:auto;font-size:13px;color:var(--lamp);font-weight:700}
.bc .note{font-size:13px;color:var(--mute);border-top:1px dashed var(--line);padding-top:10px}

/* 브랜드 상세 */
.detail{background:var(--night);border:1px solid var(--line2);border-radius:var(--r);overflow:hidden}
.dh{display:flex;align-items:center;gap:14px;padding:20px;border-bottom:1px solid var(--line);flex-wrap:wrap;background:linear-gradient(120deg,rgba(255,181,71,.08),transparent)}
.dh .blogo{width:56px;height:56px}
.dh h2{font-family:var(--f-disp);font-weight:400;font-size:26px}
.ptabs{display:flex;gap:4px;overflow-x:auto;padding:10px 14px;border-bottom:1px solid var(--line);scrollbar-width:none}
.ptabs::-webkit-scrollbar{display:none}
.pt{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:10px;font-weight:700;font-size:14px;color:var(--mute);flex:none}
.pt svg{width:17px;height:17px}
.pt.on{background:var(--panel2);color:var(--ink)}
.pbody{padding:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.met{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-sm);padding:14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.met .l{font-size:12.5px;color:var(--mute)}
.met .v{font-size:26px;font-weight:800;line-height:1.2}
.met .t{font-size:13px;color:var(--ink);overflow-wrap:anywhere}
.met .f{font-size:11.5px;color:var(--dim)}
.met.wide{grid-column:1/-1}
.empty{grid-column:1/-1;border:1px dashed var(--line2);border-radius:var(--r-sm);padding:18px;color:var(--mute);font-size:14px}
.empty b{color:var(--ink)}
.plink{grid-column:1/-1;display:flex;gap:10px;flex-wrap:wrap}
.plink a{font-size:13px;color:var(--lamp);text-decoration:none;border:1px solid rgba(255,181,71,.35);border-radius:999px;padding:5px 12px}

/* 이슈 */
.issues{display:flex;flex-direction:column;gap:10px}
.iss{display:grid;grid-template-columns:4px 1fr auto;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-sm);padding:14px 16px 14px 0;align-items:start}
.iss .bar{align-self:stretch;border-radius:0 3px 3px 0}
.iss.crit .bar{background:var(--crit)}.iss.warn .bar{background:var(--warn)}.iss.info .bar{background:var(--info)}.iss.done .bar{background:var(--ok)}
.iss .b{display:flex;flex-direction:column;gap:4px;min-width:0}
.iss h4{font-size:15px;font-weight:700;line-height:1.4}
.iss .m{font-size:12.5px;color:var(--dim);display:flex;gap:10px;flex-wrap:wrap}
.iss .d{font-size:13.5px;color:var(--mute)}
.iss .fix{font-size:13.5px;color:var(--ok)}
.iss .act{font-size:12.5px;color:var(--mute);border:1px solid var(--line2);border-radius:999px;padding:4px 11px;white-space:nowrap}
.iss.done{opacity:.85}
.iss .acts{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.iss .go{font-size:13px;font-weight:700;color:#1a1300;background:var(--lamp);border:0;border-radius:999px;padding:7px 14px;white-space:nowrap;cursor:pointer;transition:transform .15s,opacity .15s}
.iss .go:hover{transform:translateY(-1px)}.iss .go:disabled{opacity:.55;cursor:default;transform:none}
.iss .act{background:none;cursor:pointer}
.iss .fx{font-size:13px;line-height:1.5;border-radius:8px;padding:7px 10px;margin-top:4px;background:rgba(255,181,71,.08);color:var(--lamp)}
.iss .fx.ok{background:rgba(61,220,151,.09);color:var(--ok)}
.iss .fx b{font-weight:700}
.conn{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.cn{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-sm);padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.cn .h{display:flex;align-items:center;gap:8px;min-width:0}.cn .h b{font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cn .clogo{width:22px;height:22px;border-radius:6px;flex:none;object-fit:cover;display:inline-grid;place-items:center;color:#fff;font-weight:800}
.cn .cs{margin-left:auto;font-size:12px;font-weight:700;white-space:nowrap;padding:2px 9px;border-radius:999px;background:rgba(166,162,214,.12);color:var(--mute)}
.cn.on .cs{background:rgba(61,220,151,.12);color:var(--ok)}.cn.stale .cs{background:rgba(255,181,71,.12);color:var(--lamp)}.cn.off{border-style:dashed}
.cn .src{font-size:12.5px;color:var(--dim)}.cn .how{font-size:13px;color:var(--mute);line-height:1.5}
.cn .cmd{display:flex;gap:6px;align-items:center;background:var(--deep);border-radius:8px;padding:6px 8px;min-width:0}
.cn .cmd code{font-size:11.5px;color:var(--ink);overflow-x:auto;white-space:nowrap;flex:1;min-width:0}
.cn .cp{font-size:12px;border:1px solid var(--line2);border-radius:999px;padding:3px 10px;color:var(--ink);background:none;cursor:pointer}
.cn .tk{display:flex;gap:6px}.cn .tk input{flex:1;min-width:0;background:var(--deep);border:1px solid var(--line2);border-radius:8px;padding:8px 10px;color:var(--ink);font-size:13px}
.cn .tk .go{font-size:13px;font-weight:700;color:#1a1300;background:var(--lamp);border:0;border-radius:999px;padding:7px 14px;cursor:pointer}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;max-width:min(520px,calc(100vw - 32px));background:#211d3b;color:var(--ink);border:1px solid var(--line2);border-radius:14px;padding:12px 16px;font-size:14px;line-height:1.5;box-shadow:0 12px 40px rgba(0,0,0,.45);transition:.25s;z-index:99;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
details.res summary{cursor:pointer;color:var(--mute);font-size:14px;padding:6px 0;list-style:none}
details.res summary::before{content:"▸ ";color:var(--lamp)}
details.res[open] summary::before{content:"▾ "}

/* 2열 */
.two{display:grid;grid-template-columns:1.3fr 1fr;gap:14px}
@media (max-width:900px){.two{grid-template-columns:1fr}}
.box{background:var(--night);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.box h3{font-size:15px;font-weight:800;display:flex;gap:8px;align-items:center}
.box h3 small{font-weight:500;color:var(--dim);font-size:12.5px;margin-left:auto}

/* 타임라인 */
.tl{display:flex;flex-direction:column}
.tl li{list-style:none;display:grid;grid-template-columns:52px 14px 1fr;gap:10px;align-items:start;padding:7px 0}
.tl time{font-size:13px;color:var(--mute);font-weight:700}
.tl .c{width:10px;height:10px;border-radius:50%;margin-top:6px;border:2px solid var(--dim)}
.tl .c.published{background:var(--ok);border-color:var(--ok)}.tl .c.ready{border-color:var(--lamp)}.tl .c.failed{background:var(--crit);border-color:var(--crit)}
.tl .x{font-size:14px;line-height:1.45;min-width:0}
.tl .x small{display:block;color:var(--dim);font-size:12px}

/* 차트 */
.spark{width:100%;height:120px;display:block}
.spark text{fill:var(--dim);font-size:10px;font-family:var(--f-body)}
.hbars{display:flex;flex-direction:column;gap:8px}
.hb{display:grid;grid-template-columns:118px 1fr 50px;gap:10px;align-items:center;font-size:13px}
.hb span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mute)}
.track{height:9px;border-radius:5px;background:rgba(255,255,255,.06);overflow:hidden}
.track i{display:block;height:100%;border-radius:5px;background:var(--lamp);width:0;transition:width 1s var(--ease)}
.track i.lo{background:var(--dim)}

/* 표 */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-sm)}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:640px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--mute);font-weight:600;background:rgba(255,255,255,.03);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td .why{display:block;color:var(--dim);font-size:12px}
.v-터짐{color:var(--brand);background:rgba(255,46,110,.14)}.v-좋음{color:var(--ok);background:rgba(61,220,151,.12)}.v-보통{color:var(--mute);background:rgba(143,139,196,.12)}.v-부진{color:var(--crit);background:rgba(255,90,95,.12)}.v-측정중{color:var(--info);background:rgba(143,163,255,.12)}
.review{font-size:13.5px;color:var(--mute);white-space:pre-wrap;line-height:1.7;max-height:260px;overflow:auto}

/* 자동화 */
.cronlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:8px}
.cr{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.cr .t{display:flex;gap:8px;align-items:center;font-size:13.5px;font-weight:700}
.cr .t span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cr .t small{margin-left:auto;color:var(--dim);font-weight:500;font-size:12px;white-space:nowrap}
.runs{display:flex;gap:2px;height:22px}
.runs i{flex:1;border-radius:2px;background:var(--ok);opacity:.85}
.runs i.f{background:var(--crit);opacity:1}.runs i.p{background:var(--dim);opacity:.5}.runs i.e{background:rgba(255,255,255,.06)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--dim);flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px;background:var(--ok)}
.legend .f::before{background:var(--crit)}.legend .p::before{background:var(--dim)}

/* 활동·할 일 */
.feed{display:flex;flex-direction:column;max-height:520px;overflow:auto}
.fi{display:grid;grid-template-columns:34px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.fi:last-child{border-bottom:0}
.av{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:12px;font-weight:800}
.av.claude{background:rgba(217,119,87,.2);color:#F0A48A}.av.gpt{background:rgba(61,220,151,.15);color:var(--ok)}.av.auto{background:rgba(143,163,255,.15);color:var(--info)}
.fi p{font-size:13.5px;line-height:1.5;overflow-wrap:anywhere}
.fi small{font-size:12px;color:var(--dim)}
.todo{display:flex;flex-direction:column;gap:8px}
.td{display:flex;gap:12px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px}
.td input{width:20px;height:20px;accent-color:var(--ok);flex:none;margin-top:2px}
.td label{font-size:14px;line-height:1.5}
.td.done label{color:var(--dim);text-decoration:line-through}

/* 스킬 레이더 */

function spark(arr){if(!arr.length)return"";const W=600,Hh=120,pad=22,max=Math.max(5,...arr.map(a=>a.u));
  const x=i=>pad+i*(W-pad*2)/(arr.length-1||1),y=v=>Hh-18-(v/max)*(Hh-36);
  const pts=arr.map((a,i)=>`${x(i).toFixed(1)},${y(a.u).toFixed(1)}`).join(" ");
  const last=arr[arr.length-1];
  return `<svg class="spark" viewBox="0 0 ${W} ${Hh}" preserveAspectRatio="none" role="img" aria-label="14일 방문자">
   <line x1="${pad}" x2="${W-pad}" y1="${y(max)}" y2="${y(max)}" stroke="rgba(166,162,214,.14)"/><text x="${pad}" y="${y(max)-4}">${max}</text>
   <polygon points="${x(0)},${Hh-18} ${pts} ${x(arr.length-1)},${Hh-18}" fill="rgba(255,181,71,.14)"/>
   <polyline points="${pts}" fill="none" stroke="#FFB547" stroke-width="2.2" vector-effect="non-scaling-stroke"/>
   <circle cx="${x(arr.length-1)}" cy="${y(last.u)}" r="4" fill="#FFB547"/>
   <text x="${pad}" y="${Hh-3}">${arr[0].d.slice(5)}</text><text x="${W-pad}" y="${Hh-3}" text-anchor="end">${last.d.slice(5)} · ${last.u}명</text></svg>`}
function hbars(rows){if(!rows.length)return'<span style="color:var(--dim)">데이터 없음</span>';const max=Math.max(...rows.map(r=>r.v),1);
  return rows.map(r=>`<div class="hb"><span>${H(r.l)}</span><div class="track"><i data-w="${(r.v/max*100).toFixed(1)}"${r.lo?' class="lo"':""}></i></div><span class="num" style="text-align:right">${H(r.t??fmt(r.v))}</span></div>`).join("")}

    f.appendChild(el("div","fi",`<span class="av ${k}">${k==="gpt"?"GPT":k==="claude"?"C":"자동"}</span><div><p>${a.link?`<a href="${H(a.link)}" target="_blank" rel="noopener">${H(a.text)}</a>`:H(a.text)}</p><small>${kst(a.at)} · ${H(a.who||"")}</small></div>`))});
  if(!f.children.length)f.innerHTML=emptyBox("기록이 아직 없어요.");left.appendChild(f);
  const right=el("div","box");right.innerHTML=`<h3>사장님 할 일<small>로그인·결정만</small></h3>`;const td=el("div","todo");
  (b.todos||[]).filter(t=>scope==="all"||t.brand===scope).forEach(t=>{const r=el("div","td"+(t.done?" done":""));const id="td"+t.id;
    r.innerHTML=`<input type="checkbox" id="${id}" ${t.done?"checked":""}><label for="${id}">${H(t.text)}</label>`;
    r.querySelector("input").onchange=async e=>{r.classList.toggle("done",e.target.checked);await post({action:"todo_done",id:t.id,done:e.target.checked})};td.appendChild(r)});
  if(!td.children.length)td.innerHTML=emptyBox("지금은 사장님이 할 일이 없어요.");right.appendChild(td);
  two.append(left,right);s.appendChild(two);return s}

function skillsSection(){const s=el("section");s.id="skills";const sk=DATA.skills||[];
  s.innerHTML=`<div class="sh"><span class="eye">SKILL RADAR</span><h2>스킬 레이더</h2><span class="meta">GitHub 인기 스킬 매일 수집 · ★ = 사장님 작업 추천</span></div>`;
  const g=el("div","skills");
  if(!sk.length)g.innerHTML=emptyBox("매일 아침 GitHub에서 추천 많이 받은 스킬을 모아 여기에 정리해요. 첫 수집이 끝나면 채워집니다.");
  sk.forEach(k=>{const c=el("article","sk"+(k.pick?" pick":""));const dlt=k.stars_prev!=null&&k.stars!=null?k.stars-k.stars_prev:null;
    c.innerHTML=`<div class="h">${ico("github",16,"#F3F1FF")}<h4>${k.pick?"★ ":""}${H(k.name)}</h4><span class="st">★ ${fmt(k.stars)}${dlt?` (+${fmt(dlt)})`:""}${k.rank?` · ${k.rank}위`:""}</span></div>
     ${k.what?`<p><b>무엇:</b> ${H(k.what)}</p>`:""}${k.how?`<p><b>잘 쓰는 법:</b> ${H(k.how)}</p>`:""}${k.where_use?`<p><b>어디에:</b> ${H(k.where_use)}</p>`:""}
     ${k.reviews?`<p><b>후기:</b> ${H(k.reviews)}</p>`:""}${k.good_for?`<p><b>꿀인 사람:</b> ${H(k.good_for)}</p>`:""}
     ${k.pick&&k.pick_reason?`<p class="why"><b>내 작업에 쓰면:</b> ${H(k.pick_reason)}</p>`:""}
     ${k.status==="applied"?`<p class="why" style="background:rgba(61,220,151,.09);color:var(--ok)"><b style="color:var(--ok)">✓ 내 시스템에 적용됨</b> · ${H(k.applied_note||"")}</p>`:k.status==="testing"?`<p class="why" style="background:rgba(143,163,255,.1)"><b>시험 대기</b> · ${H(k.applied_note||"")}</p>`:""}
     ${k.url?`<a href="${H(k.url)}" target="_blank" rel="noopener" style="font-size:13px;color:var(--lamp)">저장소 열기 ↗</a>`:""}`;g.appendChild(c)});
  s.appendChild(g);return s}

function render(){if(!DATA)return;renderCats();const m=$("#main");m.innerHTML="";
  const B=BRANDS.find(b=>b.id===VIEW);
  if(VIEW==="all"){
    const s1=el("section");s1.innerHTML=statusBanner("all")+kpiStrip();m.appendChild(s1);
    const s2=el("section");s2.innerHTML=`<div class="sh"><span class="eye">CHANNELS</span><h2>카테고리</h2><span class="meta">카드를 누르면 채널별로 나눠 보여줘요</span></div>`;
    const g=el("div","brands");BRANDS.forEach(b=>g.appendChild(brandCard(b)));s2.appendChild(g);m.appendChild(s2);
    m.appendChild(issuesSection("all"));m.appendChild(publishSection());m.appendChild(connSection());m.appendChild(autoSection());m.appendChild(activitySection("all"));m.appendChild(skillsSection());
  } else if(B){
    const s1=el("section");s1.innerHTML=statusBanner(B.id);s1.appendChild(detailView(B));m.appendChild(s1);
    m.appendChild(issuesSection(B.id));if(B.id==="playn")m.appendChild(publishSection());m.appendChild(activitySection(B.id));
  } else if(VIEW==="auto"){m.appendChild(connSection());m.appendChild(issuesSection("auto"));m.appendChild(autoSection())}
  else if(VIEW==="skills"){m.appendChild(skillsSection())}
  countUp(m);requestAnimationFrame(()=>m.querySelectorAll(".track i[data-w]").forEach(i=>i.style.width=i.dataset.w+"%"));
}

/* ── 데이터 ── */
const post=b=>fetch(API,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({...b,key:KEY})}).then(r=>r.json()).catch(()=>({ok:false,error:"네트워크 연결이 끊겼어요"}));
async function load(){const j=await post({action:"board"});
  if(!j.ok){if(/관리 키/.test(j.error||"")){$("#app").hidden=true;$("#gate").hidden=false;if(KEY){$("#gateErr").hidden=false;$("#gateErr").textContent=j.error}return}
    $("#liveDot").classList.add("off");$("#liveTxt").textContent="갱신 실패 · 다시 시도 중";return}
  st.set("pn_admin",KEY);$("#gate").hidden=true;$("#app").hidden=false;DATA=j;lastOk=Date.now();$("#liveDot").classList.remove("off");render();tick()}
function tick(){if(!lastOk)return;const s=Math.round((Date.now()-lastOk)/1000);$("#liveTxt").textContent=s<5?"실시간 · 방금 갱신":`실시간 · ${s}초 전 갱신`}
function route(){const h=location.hash.replace("#","");VIEW=["all","auto","skills",...BRANDS.map(b=>b.id)].includes(h)?h:(h==="issues"||h==="publish"||h==="activity"?VIEW:"all");
  if(["issues","publish","activity"].includes(h))return;render();window.scrollTo({top:0,behavior:"smooth"})}
window.addEventListener("hashchange",route);
$("#gateForm").addEventListener("submit",e=>{e.preventDefault();KEY=$("#keyIn").value.trim();load()});
$("#refresh").onclick=()=>{$("#liveTxt").textContent="갱신 중";load()};
setInterval(()=>{if(!document.hidden)load()},45000);setInterval(tick,1000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&Date.now()-lastOk>30000)load()});
VIEW=(location.hash.replace("#","")||"all");
if(KEY)load();else{$("#gate").hidden=false}
</script>
</body>
